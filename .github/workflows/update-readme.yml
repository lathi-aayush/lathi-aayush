name: Update README

on:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["tools/readme-config.json", "tools/update-readme.mjs"]

permissions:
  contents: write # needed to commit the regenerated README

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No npm install: the script only uses Node built-ins.
      - run: node tools/update-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh README stats"
          git push
